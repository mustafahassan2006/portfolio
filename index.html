<script>
    const name = "Mustafa";
    let index = 0;

    function typeEffect() {
        if (index < name.length) {
            // Add one letter at a time to the span
            document.getElementById("typed-name").innerHTML += name.charAt(index);
            index++;
            // Adjust the '150' to make it faster (lower) or slower (higher)
            setTimeout(typeEffect, 150);
        }
    }

    // This makes the script run as soon as the page finishes loading
    window.onload = typeEffect;
</script>
